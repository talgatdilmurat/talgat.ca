# Block /_meta/* from being served publicly.
# /_meta/ holds internal planning and build-log files (MASTER_CONTEXT.md,
# BUILD_PLAN_*.md, NEXT_STEPS.md, BUILD_LOG.md). They live in git so future
# Claude sessions can read them, but they should not be reachable at
# talgat.ca/_meta/MASTER_CONTEXT.md or any other public URL.
#
# force = true makes the redirect apply even when a matching static file
# exists at the requested path, which is exactly what we want here.

[[redirects]]
  from = "/_meta/*"
  to = "/404.html"
  status = 404
  force = true
